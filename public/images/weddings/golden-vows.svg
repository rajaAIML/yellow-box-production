<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(40,15%,8%)"/>
      <stop offset="50%" style="stop-color:hsl(40,20%,14%)"/>
      <stop offset="100%" style="stop-color:hsl(40,10%,6%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:hsl(40,40%,25%);stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:hsl(40,40%,25%);stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <text x="800" y="560" text-anchor="middle" fill="#666" font-family="system-ui,sans-serif" font-size="28" letter-spacing="8">GOLDEN VOWS</text>
  <text x="800" y="610" text-anchor="middle" fill="#444" font-family="system-ui,sans-serif" font-size="14" letter-spacing="4">WEDDINGS</text>
  <rect x="700" y="640" width="200" height="2" fill="#ffc700" opacity="0.5"/>
</svg>
